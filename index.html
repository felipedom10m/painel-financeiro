<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111416">
  <meta name="description" content="Painel financeiro orientado por propósito, previsibilidade e tempo protegido.">
  <title>Painel Financeiro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Financeiro">
</head>
<body>
  <div id="app-status" class="app-status hidden" role="status" aria-live="polite"></div>
  <header class="app-header">
    <div><p class="eyebrow">VISÃO, CAIXA E TEMPO</p><h1>PAINEL FINANCEIRO</h1></div>
    <button id="sync-button" class="icon-button" type="button" aria-label="Sincronizar dados" title="Sincronizar dados">↻</button>
  </header>
  <main id="app" class="app-shell" aria-busy="true">
    <section class="skeleton-card skeleton-hero" aria-label="Carregando painel"></section>
    <section class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></section>
  </main>
  <button id="new-record-button" class="new-record-button hidden" type="button"><span aria-hidden="true">＋</span> NOVO REGISTRO</button>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <form id="dialog-form" method="dialog" novalidate>
      <div class="dialog-header">
        <div><p id="dialog-kicker" class="eyebrow"></p><h2 id="dialog-title"></h2></div>
        <button class="dialog-close icon-button" type="button" data-action="close-dialog" aria-label="Fechar">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <p id="dialog-error" class="form-error hidden" role="alert"></p>
      <div class="dialog-actions">
        <button class="button button-secondary" type="button" data-action="close-dialog">Cancelar</button>
        <button id="dialog-submit" class="button button-primary" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.financeSupabase = window.supabase.createClient(
      'https://gqswzyuaggalrpldsojt.supabase.co',
      'sb_publishable_KUP40TLX5yr7-OUzLzAq4g_kVtm3ivD'
    );
  </script>
  <script type="module" src="app/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/painel-financeiro/service-worker.js')
          .then(registration => registration.update())
          .catch(() => document.getElementById('app-status')?.classList.remove('hidden'));
      });
    }
  </script>
</body>
</html>
